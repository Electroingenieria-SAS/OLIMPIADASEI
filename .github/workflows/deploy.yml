name: Publicar Olimpiadas EI Pixel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Crear paquete estático (no publicar código PHP)
        run: |
          mkdir -p dist
          cp index.html dist/
          cp -R css js assets dist/
          touch dist/.nojekyll
          test -s dist/index.html
          test -s dist/js/games.js
          test -s dist/js/app.js
          test -s dist/js/characters.js
          test -s dist/css/arcade.css
          test -s dist/assets/superretro/gamepack.bin
          node --check dist/js/characters.js
          node --check dist/js/hero-runtime.js
          test -s dist/assets/pixel-heroes/personajes/01_jefe/atlas_completo.png
          test -s dist/assets/pixel-heroes/personajes/06_operativo/atlas_completo.png
          node --check dist/js/app.js
          node --check dist/js/games.js
          test -s dist/js/sprites.js
          test -s dist/assets/superretro/gamepack.bin
          test -s dist/assets/superretro/manifest.json
      - name: Verificar integridad de scripts y assets Free Tier
        run: |
          node --check js/app.js
          node --check js/games.js
          node --check js/data.js
          node --check js/sprites.js
          node --check js/characters.js
          node --check js/hero-runtime.js
          node tools/check_pixel_heroes.mjs
          node tools/check_party_v2.mjs
          node -e "const m=require('./assets/superretro/manifest.json'); if(m.sprite_count!==53 || m.sprites.length!==53)process.exit(1); console.log('Sprites verificados:', m.sprite_count)"
          node -e "const fs=require('fs');const b=fs.readFileSync('assets/superretro/gamepack.bin');if(b.subarray(0,5).toString()!=='EISR2' || b.length<50000)process.exit(1);console.log('Pack validado:',b.length,'bytes')"
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
