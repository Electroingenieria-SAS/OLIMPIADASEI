name: Publicar Olimpiadas EI Pixel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Crear paquete estático (no publicar código PHP)
        run: |
          mkdir -p dist
          cp index.html dist/
          cp -R css js assets dist/
          touch dist/.nojekyll
          test -s dist/index.html
          test -s dist/js/games.js
          test -s dist/js/app.js
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
